@if (groupedConversations()) { @for(dt of sortedDates(); track dt) {
<li class="list-group-item d-flex align-items-start font-small cursor-pointer">
  <b>{{ dt }}</b>
</li>

@for(talk of groupedConversations()[dt]; track talk.id) {
<li
  (click)="loadConversation(talk.id)"
  [ngClass]="{ active: talk.id === currentConversationId() }"
  class="list-group-item d-flex align-items-start justify-content-between"
>
  <div class="text-truncate me-2 cursor-pointer font-small">
    {{ talk.title }}
  </div>
  <div>×</div>
</li>
} } }
