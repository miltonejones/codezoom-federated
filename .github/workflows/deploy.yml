name: Deploy Micro-Frontends to Azure

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-microfrontend-dev
  ENVIRONMENT: dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive git checkout main || true

      - name: Build all apps
        run: |
          for app in app-host app-list app-workspace; do
            if [ -d "$app" ]; then
              echo "Building $app..."
              cd "$app"
              npm install --legacy-peer-deps
              npm run build -- --configuration=production 2>/dev/null || npm run build
              cd ..
            fi
          done

      - name: Verify builds
        run: |
          echo "=== Build Verification ==="
          for app in app-host app-list app-workspace; do
            # Check for Angular 17+ browser output path
            if [ -d "$app/dist/$app/browser" ] && [ -f "$app/dist/$app/browser/index.html" ]; then
              echo "✅ $app: Found at dist/$app/browser"
              ls -la "$app/dist/$app/browser" | head -5
            elif [ -d "$app/dist/$app" ] && [ -f "$app/dist/$app/index.html" ]; then
              echo "✅ $app: Found at dist/$app"
              ls -la "$app/dist/$app" | head -5
            else
              echo "❌ $app: Build not found"
              find $app -name "index.html" 2>/dev/null || echo "No index.html found"
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            app-host/dist/
            app-list/dist/
            app-workspace/dist/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-builds
          path: ./

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get deployment tokens
        id: tokens
        run: |
          echo "Getting app info for: ${{ env.AZURE_RESOURCE_GROUP }}"

          HOST_NAME=$(az staticwebapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'app-host')].name" -o tsv | head -1)
          LIST_NAME=$(az staticwebapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'app-list')].name" -o tsv | head -1)
          WORKSPACE_NAME=$(az staticwebapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'app-workspace')].name" -o tsv | head -1)

          echo "HOST_NAME=$HOST_NAME" >> $GITHUB_OUTPUT
          echo "LIST_NAME=$LIST_NAME" >> $GITHUB_OUTPUT
          echo "WORKSPACE_NAME=$WORKSPACE_NAME" >> $GITHUB_OUTPUT

          if [ -n "$HOST_NAME" ]; then
            HOST_TOKEN=$(az staticwebapp secrets list --name $HOST_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.apiKey -o tsv)
            echo "HOST_TOKEN=$HOST_TOKEN" >> $GITHUB_OUTPUT
          fi
          if [ -n "$LIST_NAME" ]; then
            LIST_TOKEN=$(az staticwebapp secrets list --name $LIST_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.apiKey -o tsv)
            echo "LIST_TOKEN=$LIST_TOKEN" >> $GITHUB_OUTPUT
          fi
          if [ -n "$WORKSPACE_NAME" ]; then
            WORKSPACE_TOKEN=$(az staticwebapp secrets list --name $WORKSPACE_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.apiKey -o tsv)
            echo "WORKSPACE_TOKEN=$WORKSPACE_TOKEN" >> $GITHUB_OUTPUT
          fi

      - name: Deploy app-host
        if: steps.tokens.outputs.HOST_TOKEN != ''
        run: |
          echo "Deploying app-host..."
          # Use the same path as your working deploy.sh
          SOURCE_PATH="./app-host/dist/app-host/browser"

          if [ -d "$SOURCE_PATH" ] && [ -f "$SOURCE_PATH/index.html" ]; then
            echo "Deploying from $SOURCE_PATH"
            swa deploy \
              --deployment-token ${{ steps.tokens.outputs.HOST_TOKEN }} \
              --env ${{ env.ENVIRONMENT }} \
              --app-name ${{ steps.tokens.outputs.HOST_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --app-location "$SOURCE_PATH" \
              --verbose
          else
            echo "❌ Build not found at $SOURCE_PATH"
            echo "Available paths:"
            find ./app-host -name "index.html" 2>/dev/null
            exit 1
          fi

      - name: Deploy app-list
        if: steps.tokens.outputs.LIST_TOKEN != ''
        run: |
          echo "Deploying app-list..."
          SOURCE_PATH="./app-list/dist/app-list/browser"

          if [ -d "$SOURCE_PATH" ] && [ -f "$SOURCE_PATH/index.html" ]; then
            echo "Deploying from $SOURCE_PATH"
            swa deploy \
              --deployment-token ${{ steps.tokens.outputs.LIST_TOKEN }} \
              --env ${{ env.ENVIRONMENT }} \
              --app-name ${{ steps.tokens.outputs.LIST_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --app-location "$SOURCE_PATH" \
              --verbose
          else
            echo "❌ Build not found at $SOURCE_PATH"
            find ./app-list -name "index.html" 2>/dev/null
          fi

      - name: Deploy app-workspace
        if: steps.tokens.outputs.WORKSPACE_TOKEN != ''
        run: |
          echo "Deploying app-workspace..."
          SOURCE_PATH="./app-workspace/dist/app-workspace/browser"

          if [ -d "$SOURCE_PATH" ] && [ -f "$SOURCE_PATH/index.html" ]; then
            echo "Deploying from $SOURCE_PATH"
            swa deploy \
              --deployment-token ${{ steps.tokens.outputs.WORKSPACE_TOKEN }} \
              --env ${{ env.ENVIRONMENT }} \
              --app-name ${{ steps.tokens.outputs.WORKSPACE_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --app-location "$SOURCE_PATH" \
              --verbose
          else
            echo "❌ Build not found at $SOURCE_PATH"
            find ./app-workspace -name "index.html" 2>/dev/null
          fi

      - name: Configure Federation URLs
        if: steps.tokens.outputs.HOST_TOKEN != ''
        run: |
          echo "Configuring federation URLs..."
          LIST_URL=$(az staticwebapp show --name ${{ steps.tokens.outputs.LIST_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query defaultHostname -o tsv)
          WORKSPACE_URL=$(az staticwebapp show --name ${{ steps.tokens.outputs.WORKSPACE_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query defaultHostname -o tsv)

          az staticwebapp appsettings set \
            --name ${{ steps.tokens.outputs.HOST_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --setting-names "APP_LIST_URL=https://${LIST_URL}" "APP_WORKSPACE_URL=https://${WORKSPACE_URL}"

      - name: Display URLs
        run: |
          echo ""
          echo "Deployment Complete!"
          echo "==================================="
          if [ -n "${{ steps.tokens.outputs.HOST_NAME }}" ]; then
            HOST_URL=$(az staticwebapp show --name ${{ steps.tokens.outputs.HOST_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query defaultHostname -o tsv)
            echo "Host App: https://$HOST_URL"
            echo "Host Remote Entry: https://$HOST_URL/remoteEntry.json"
          fi
