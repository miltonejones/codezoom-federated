name: Deploy Micro-Frontends to Azure

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-microfrontend-dev
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'default' || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive
          git submodule foreach --recursive git checkout main || true

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure resource group exists
        run: |
          echo "Checking resource group: ${{ env.AZURE_RESOURCE_GROUP }}"

          if az group exists --name ${{ env.AZURE_RESOURCE_GROUP }} | grep -q "true"; then
            echo "✅ Resource group '${{ env.AZURE_RESOURCE_GROUP }}' exists"
          else
            echo "⚠️ Resource group '${{ env.AZURE_RESOURCE_GROUP }}' does not exist"
            echo "Creating resource group..."
            az group create \
              --name ${{ env.AZURE_RESOURCE_GROUP }} \
              --location eastus
              
            if [ $? -eq 0 ]; then
              echo "✅ Resource group '${{ env.AZURE_RESOURCE_GROUP }}' created successfully"
            else
              echo "❌ Failed to create resource group"
              exit 1
            fi
          fi

      - name: Get remote entry locations
        id: remotes
        run: |

          echo "Looking up remote URLs..."

          LIST_APP_NAME=$(az staticwebapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'app-list')].name" -o tsv | head -1)
          WORKSPACE_APP_NAME=$(az staticwebapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'app-workspace')].name" -o tsv | head -1)

          LIST_REMOTE_URL=$(az staticwebapp environment list --name $LIST_APP_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?name=='${{ env.ENVIRONMENT }}'].hostname" -o tsv) 
          WORKSPACE_REMOTE_URL=$(az staticwebapp environment list --name $WORKSPACE_APP_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?name=='${{ env.ENVIRONMENT }}'].hostname" -o tsv)  

          echo "LIST_REMOTE_URL=$LIST_REMOTE_URL" >> $GITHUB_OUTPUT
          echo "WORKSPACE_REMOTE_URL=$WORKSPACE_REMOTE_URL" >> $GITHUB_OUTPUT

      - name: Generate federation manifest
        run: |

          cat > app-host/public/federation.manifest.json << 'EOF'
          {
            "app-list": "${{ steps.remotes.outputs.LIST_REMOTE_URL}}/remoteEntry.json",
            "app-workspace": "${{ steps.remotes.outputs.WORKSPACE_REMOTE_URL}}/remoteEntry.json"
          }
          EOF

          echo "Generated manifest:"
          cat app-host/public/federation.manifest.json

      - name: Build app-host
        run: |
          if [ -d "app-host" ]; then
            echo "Building app-host..."
            cd app-host
            rm -rf dist .angular
            npm install --legacy-peer-deps
            npm run build -- --configuration=production  
            if [ -f "dist/app-host/browser/index.html" ]; then
              echo "✅ Build successful - index.html found"
              ls -la dist/app-host/browser
            else
              echo "❌ Build failed - index.html not found"
              find dist -name "*.html"
              exit 1
            fi
            cd ..
          fi

      - name: Build app-list
        run: |
          if [ -d "app-list" ]; then
            echo "Building app-list..."
            cd app-list
            npm install --legacy-peer-deps
            npm run build -- --configuration=production
            cd ..
          fi

      - name: Add CORS to app-list
        run: |
          # After building, add the CORS config to the build output
          cat > app-list/dist/app-list/browser/staticwebapp.config.json << 'EOF'
          {
            "globalHeaders": {
              "Access-Control-Allow-Origin": "*",
              "Access-Control-Allow-Methods": "GET, OPTIONS",
              "Access-Control-Allow-Headers": "Content-Type"
            }
          }
          EOF

      - name: Generate environment file based on branch
        run: |
          # Generate the environment.ts file 
          cat > app-workspace/src/environments/environment.ts << 'EOF'
          export const environment = {
            production: ${{ github.ref_name == 'main' }},
            assetsUrl: 'https://${{ steps.remotes.outputs.WORKSPACE_REMOTE_URL }}'
          };
          EOF
          echo "Generated environment.ts with assetsUrl: $ASSETS_URL"

      - name: Build app-workspace
        run: |
          if [ -d "app-workspace" ]; then
            echo "Building app-workspace..."
            cd app-workspace
            npm install --legacy-peer-deps
            npm run build -- --configuration=production
            cd ..
          fi

      - name: Add CORS to app-workspace
        run: |
          # After building, add the CORS config to the build output
          cat > app-workspace/dist/app-workspace/browser/staticwebapp.config.json << 'EOF'
          {
            "globalHeaders": {
              "Access-Control-Allow-Origin": "*",
              "Access-Control-Allow-Methods": "GET, OPTIONS",
              "Access-Control-Allow-Headers": "Content-Type"
            }
          }
          EOF

      - name: Verify build outputs
        run: |
          echo "Verifying build outputs..."
          for app in app-host app-list app-workspace; do
            if [ -d "$app/dist/$app" ]; then
              echo "✅ $app: dist/$app found"
              ls -la "$app/dist/$app" | head -5
            elif [ -d "$app/dist" ]; then
              echo "✅ $app: dist found"
              ls -la "$app/dist" | head -5
            else
              echo "⚠️ No dist found for $app"
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            app-host/dist/app-host/browser
            app-list/dist/app-list/browser
            app-workspace/dist/app-workspace/browser
          if-no-files-found: warn

      - name: Debug build outputs - show file structure
        run: |
          echo "=== FULL BUILD OUTPUT DEBUG ==="
          for app in app-host app-list app-workspace; do
            if [ -d "$app/dist/$app/browser" ]; then
              echo ""
              echo "📁 $app/dist/$app/browser contents:"
              find "$app/dist/$app/browser" -type f -name "*.html" -o -name "*.js" -o -name "*.css" | head -20
              echo "Total files: $(find "$app/dist/$app/browser" -type f | wc -l)"
              
              # Show file sizes and timestamps
              echo "File details:"
              ls -la "$app/dist/"* 2>/dev/null | head -10
            fi
          done

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Simplified condition - always run deploy after build if on main or develop
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-builds
          path: ./

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SWA CLI
        run: npm install -g @azure/static-web-apps-cli

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get deployment tokens
        id: tokens
        run: |
          echo "Getting app info for: ${{ env.AZURE_RESOURCE_GROUP }}"

          HOST_NAME=$(az staticwebapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'app-host')].name" -o tsv | head -1)
          LIST_NAME=$(az staticwebapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'app-list')].name" -o tsv | head -1)
          WORKSPACE_NAME=$(az staticwebapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'app-workspace')].name" -o tsv | head -1)

          echo "HOST_NAME=$HOST_NAME" >> $GITHUB_OUTPUT
          echo "LIST_NAME=$LIST_NAME" >> $GITHUB_OUTPUT
          echo "WORKSPACE_NAME=$WORKSPACE_NAME" >> $GITHUB_OUTPUT

          if [ -n "$HOST_NAME" ]; then
            HOST_TOKEN=$(az staticwebapp secrets list --name $HOST_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.apiKey -o tsv)
            echo "HOST_TOKEN=$HOST_TOKEN" >> $GITHUB_OUTPUT
            echo "Found host token"
          fi

          if [ -n "$LIST_NAME" ]; then
            LIST_TOKEN=$(az staticwebapp secrets list --name $LIST_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.apiKey -o tsv)
            echo "LIST_TOKEN=$LIST_TOKEN" >> $GITHUB_OUTPUT
            echo "Found list token"
          fi

          if [ -n "$WORKSPACE_NAME" ]; then
            WORKSPACE_TOKEN=$(az staticwebapp secrets list --name $WORKSPACE_NAME --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.apiKey -o tsv)
            echo "WORKSPACE_TOKEN=$WORKSPACE_TOKEN" >> $GITHUB_OUTPUT
            echo "Found workspace token"
          fi

      - name: Deploy app-host
        if: steps.tokens.outputs.HOST_TOKEN != ''
        run: |
          echo "Deploying app-host..."
          DEPLOY_PATH="./app-host/dist/app-host/browser"

          echo "Files being deployed from $DEPLOY_PATH:"
          find "$DEPLOY_PATH" -type f | head -20
          echo "Total files: $(find "$DEPLOY_PATH" -type f | wc -l)"

          if [ -d "./app-host/dist/app-host/browser" ]; then
            swa deploy \
              --deployment-token ${{ steps.tokens.outputs.HOST_TOKEN }} \
              --env ${{ env.ENVIRONMENT }} \
              --app-name ${{ steps.tokens.outputs.HOST_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --app-location "$DEPLOY_PATH"
          elif [ -d "./app-host/dist" ]; then
            swa deploy \
              --deployment-token ${{ steps.tokens.outputs.HOST_TOKEN }} \
              --env ${{ env.ENVIRONMENT }} \
              --app-name ${{ steps.tokens.outputs.HOST_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --app-location ./app-host/dist
          else
            echo "No build found for app-host"
            ls -la ./app-host/
          fi

      - name: Deploy app-list
        if: steps.tokens.outputs.LIST_TOKEN != ''
        run: |
          echo "Deploying app-list..."
          if [ -d "./app-list/dist/app-list/browser" ]; then
            swa deploy \
              --deployment-token ${{ steps.tokens.outputs.LIST_TOKEN }} \
              --env ${{ env.ENVIRONMENT }} \
              --app-name ${{ steps.tokens.outputs.LIST_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --app-location ./app-list/dist/app-list/browser
          elif [ -d "./app-list/dist" ]; then
            swa deploy \
              --deployment-token ${{ steps.tokens.outputs.LIST_TOKEN }} \
              --env ${{ env.ENVIRONMENT }} \
              --app-name ${{ steps.tokens.outputs.LIST_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --app-location ./app-list/dist
          else
            echo "No build found for app-list"
          fi

      - name: Deploy app-workspace
        if: steps.tokens.outputs.WORKSPACE_TOKEN != ''
        run: |
          echo "Deploying app-workspace..."
          if [ -d "./app-workspace/dist/app-workspace/browser" ]; then
            swa deploy \
              --deployment-token ${{ steps.tokens.outputs.WORKSPACE_TOKEN }} \
              --env ${{ env.ENVIRONMENT }} \
              --app-name ${{ steps.tokens.outputs.WORKSPACE_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --app-location ./app-workspace/dist/app-workspace/browser
          elif [ -d "./app-workspace/dist" ]; then
            swa deploy \
              --deployment-token ${{ steps.tokens.outputs.WORKSPACE_TOKEN }} \
              --env ${{ env.ENVIRONMENT }} \
              --app-name ${{ steps.tokens.outputs.WORKSPACE_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --app-location ./app-workspace/dist
          else
            echo "No build found for app-workspace"
          fi

      - name: Configure Federation URLs
        if: steps.tokens.outputs.HOST_TOKEN != ''
        run: |
          echo "Configuring federation URLs..."
          LIST_URL=$(az staticwebapp show --name ${{ steps.tokens.outputs.LIST_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query defaultHostname -o tsv)
          WORKSPACE_URL=$(az staticwebapp show --name ${{ steps.tokens.outputs.WORKSPACE_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query defaultHostname -o tsv)

          az staticwebapp appsettings set \
            --name ${{ steps.tokens.outputs.HOST_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --setting-names "APP_LIST_URL=https://${LIST_URL}" "APP_WORKSPACE_URL=https://${WORKSPACE_URL}"

          echo "Federation URLs configured"

      - name: Display URLs
        run: |
          echo ""
          echo "Deployment Complete!"
          echo "==================================="
          if [ -n "${{ steps.tokens.outputs.HOST_NAME }}" ]; then
            HOST_URL=$(az staticwebapp show --name ${{ steps.tokens.outputs.HOST_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query defaultHostname -o tsv)
            echo "Host App: https://$HOST_URL"
          fi
          if [ -n "${{ steps.tokens.outputs.LIST_NAME }}" ]; then
            LIST_URL=$(az staticwebapp show --name ${{ steps.tokens.outputs.LIST_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query defaultHostname -o tsv)
            echo "List App: https://$LIST_URL"
          fi
          if [ -n "${{ steps.tokens.outputs.WORKSPACE_NAME }}" ]; then
            WORKSPACE_URL=$(az staticwebapp show --name ${{ steps.tokens.outputs.WORKSPACE_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query defaultHostname -o tsv)
            echo "Workspace App: https://$WORKSPACE_URL"
          fi
