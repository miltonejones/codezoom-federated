<div class="dropdown">
  <button
    class="btn btn-sm dropdown-toggle"
    type="button"
    data-bs-toggle="dropdown"
    aria-expanded="false"
  >
    <i [class]="langIcons[selectedLang]"></i>
    {{ selectedLang }}
  </button>
  <ul class="dropdown-menu">
    @for (lang of getLangKeys(); track lang) {
    <li>
      <a (click)="setType(lang)" class="dropdown-item" href="#">
        <i [class]="langIcons[lang]"></i> {{ lang }}
      </a>
    </li>
    }
  </ul>
</div>
